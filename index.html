<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Luff atelier</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luff atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f9f4f0;--card:#fffdfa;--text:#1d1b19;--muted:#8b8378;--line:#e9e1d7;
  --blue:#2a5bd7;--blue-soft:#e4ebfb;--orange:#e5804a;--orange-soft:#fbe9dd;
  --serif:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614;--card:#211f1c;--text:#f1ece4;--muted:#9d968b;--line:#34312c;
  --blue:#7193f2;--blue-soft:#232f4c;--orange:#f0965f;--orange-soft:#3b2a20;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit}

/* 頂部 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:block;line-height:0}
.brand img{height:36px;width:auto}
.icon-btn{border:0;background:none;padding:6px;border-radius:999px;color:var(--muted);display:flex}
.icon-btn svg{width:22px;height:22px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 內容 */
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 92px);max-width:560px;margin:0 auto}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:4px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input,textarea{display:block;width:100%;max-width:100%;min-width:0;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:22px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.field{margin-bottom:16px}.field:last-child{margin-bottom:0}
/* 選項：整齊的四欄格子 */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 3px;font-size:14px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.long{font-size:12px;letter-spacing:-.02em}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.suggest{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.sug{text-align:left;border:1px solid var(--line);background:var(--blue-soft);border-radius:12px;padding:9px 12px;font-size:15px}
.sug small{color:var(--muted);font-size:12px}
.submit{width:100%;padding:15px;font-size:17px;font-weight:600;border:0;border-radius:14px;background:var(--text);color:var(--bg)}
.submit:disabled{opacity:.5}

.rec .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.rec .meta{color:var(--muted);font-size:13px;margin-top:4px}
.rec .note{font-size:14px;margin-top:6px}
.rec{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s,background .15s}
.rec.pressing{transform:scale(.98);background:var(--blue-soft)}
.search-box{position:relative}
.search-box svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted)}
.search-box input{padding-left:42px;height:48px;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.05)}
#cus-empty{margin-top:16px}
.cus-hero{text-align:center;padding:28px 20px 24px}
.blobs{position:relative;width:86px;height:70px;margin:0 auto 14px}
.blobs i{position:absolute;border-radius:50%;opacity:.92}
.blobs i:first-child{width:46px;height:60px;left:34px;top:0;background:var(--orange);transform:rotate(-12deg)}
.blobs i:last-child{width:44px;height:56px;left:8px;top:14px;background:var(--blue);transform:rotate(-28deg)}
.hero-title{margin:0;font-size:18px;font-weight:600}
.hero-sub{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.cus-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cus-stats .card{margin:0;padding:14px 12px;text-align:center}
.cus-stats span{display:block;font-size:12px;color:var(--muted)}
.cus-stats small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cus-stats b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.cus-stats .card:nth-child(2) b{color:var(--orange)}
.cus-stats .card:nth-child(3) b{color:var(--blue)}
#update-bar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 8px);z-index:30;border:0;border-radius:12px;padding:12px;background:var(--blue);color:#fff;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.back{border:0;background:none;color:var(--blue);font-size:15px;padding:4px 0 12px}
.cus-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px;font-size:16px}
.cus-row small{color:var(--muted);font-size:12px;white-space:nowrap}
#cus-results{margin-top:4px}
.cus-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cus-head .btn2{flex-shrink:0;margin-top:4px}
.cus-name{font-family:var(--serif);font-size:26px;margin-bottom:12px}
.cus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.cus-grid span{display:block;font-size:12px;color:var(--muted)}
.cus-grid b{font-size:16px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--orange-soft);border-radius:8px;padding:5px 9px;font-size:13px}
.tag small{color:var(--muted);margin-left:3px;font-size:11px}
.tags .none{font-size:13px;color:var(--muted)}
.more{display:block;width:100%;margin-top:4px}
#view-customers .rec{-webkit-user-select:auto;user-select:auto}
.rec-hint{margin:-6px 2px 12px;font-size:13px;color:var(--muted)}
.act{text-align:center}
.act h3{margin-bottom:2px}
.act p{margin:0 0 16px;color:var(--muted);font-size:14px}
.act button{display:block;width:100%;margin-top:10px}
.editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-soft);border:1px solid var(--blue);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.del{display:block;width:100%;margin-top:10px;padding:13px;font-size:15px;border:1px solid #c4452e;color:#c4452e;background:none;border-radius:14px}
.del:disabled{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:32px}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav strong{font-family:var(--serif);font-weight:500;font-size:22px}
.btn2{border:1px solid var(--line);background:var(--card);border-radius:999px}
.monthnav .btn2{font-size:20px;line-height:1;padding:6px 16px}
.btn2.small{padding:5px 12px;font-size:13px}
.stats2{display:flex;gap:12px}.stats2>.card{flex:1;min-width:0}
.stat .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
#st-total{color:var(--orange)}
.tgt{margin-top:16px}
.tgt .row1{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.tgt .sub{font-size:13px;color:var(--muted);margin-top:5px}
.tgt .sub strong{color:var(--orange)}
.fc{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fc .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--text);font-size:14px;margin-bottom:4px}
.logout{display:block;margin:24px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}

/* ===== 風格 B：藍橘主色 ===== */
:root{--line:#eee3d6}
h2{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:.02em}
h2::before{content:"";flex-shrink:0;width:14px;height:18px;border-radius:50%;background:var(--blue);transform:rotate(-20deg);box-shadow:8px -3px 0 -1px var(--orange)}
.monthnav strong{font-weight:600;font-size:18px}
.sheet h3,.cus-name{font-weight:600}
.submit{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(229,128,74,.28)}
.chip.on{background:var(--blue);border-color:var(--blue);box-shadow:0 3px 10px rgba(42,91,215,.22)}
.card{border:0;box-shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.05)}
.lbl{color:#9a8a7a}
.tab.active{color:var(--orange)}
.bar>i{background:linear-gradient(90deg,var(--blue),#5b82e6)}
@media (prefers-color-scheme:dark){
  :root{--line:#34312c}
  .card{border:1px solid var(--line);box-shadow:none}
  .lbl{color:var(--muted)}
  .submit{box-shadow:none}
}

/* 底部分頁列 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--orange)}

/* 登入 */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(env(safe-area-inset-bottom) + 32px);gap:18px}
#login img{width:min(66vw,260px);height:auto;display:block}
#login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#login p{margin:0;font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
#login p.err{color:#c4452e}

.codes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.codes:empty{display:none}
.code{border:1px solid var(--line);background:var(--orange-soft);border-radius:8px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.codes .hint{width:100%;font-size:12px;color:var(--muted)}
.name-note{background:var(--orange-soft);border-radius:12px;padding:12px;margin-bottom:6px;font-size:14px;line-height:1.5}
.name-note.new{background:var(--blue-soft)}
.name-picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.name-pick{border:1px solid var(--orange);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600}
.name-pick.keep{border-color:var(--line);font-weight:400;color:var(--muted)}
#cf-ok:disabled{opacity:.4}
.pend{margin:-4px 0 14px}
.pend-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-size:13px;color:var(--muted)}
.pend-head b{color:var(--text);font-size:14px}
.pend-chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--blue);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-family:inherit;color:var(--text)}
.pchip .t{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.pchip .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.later{border-style:dashed;border-color:var(--line);color:var(--muted)}
.pchip.later .t{color:var(--muted);font-weight:400}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(20,18,16,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease-out}
.sheet{width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:var(--card);border-radius:22px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.18);animation:pop .26s cubic-bezier(.2,.9,.3,1.25)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-wrap{animation:none}}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 10px}
.cf-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.cf-row span:first-child{color:var(--muted);flex-shrink:0}
.cf-row span:last-child{text-align:right;overflow-wrap:anywhere}
.cf-btns{display:flex;gap:10px;margin-top:16px}
.cf-btns>*{flex:1}
.btn-ghost{padding:15px;font-size:17px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:10}
.toast.show{opacity:1}
.hidden{display:none!important}

/* ===== 風格 C：灰白大圓角＋品牌藍橘（參考元件牆） ===== */
:root{--bg:#fbfbfb;--card:#f3f3f1;--line:#ebebe8;--text:#171717;--muted:#8d8d89;--blue:#2a5bd7;--orange:#e5804a;--blue-soft:#ffffff;--orange-soft:#ffffff;--blue-grad:linear-gradient(135deg,#5b82e6,#2a5bd7)}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1f1e1c;--line:#2e2c29;--text:#f1ece4;--muted:#9a958c;--blue:#7193f2;--orange:#f0965f;--blue-soft:#2a2926;--orange-soft:#2a2926;--blue-grad:linear-gradient(135deg,#86a4f4,#5a7fe8)}}
body,header{background:var(--bg)}
header{border-bottom:0}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border:0;border-radius:28px;box-shadow:none;padding:18px}
.lbl{color:var(--muted)}
input,textarea{background:var(--blue-soft);border:0;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
input:focus,textarea:focus{outline:2px solid var(--line)}
.chip{background:var(--blue-soft);border:0;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .25s,color .25s,transform .2s}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--blue-grad);color:#fff;box-shadow:none;padding-left:6px}
.chip.on::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-right:3px;border-radius:50%;background:rgba(255,255,255,.28);font-size:10px;vertical-align:1px;animation:tick .35s cubic-bezier(.3,1.6,.5,1)}
.chip.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tick{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.chip.add{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.submit{background:var(--text);color:var(--bg);border-radius:999px;box-shadow:none;font-weight:600}
.btn-ghost{background:var(--card);border:0;border-radius:999px}
.btn2{background:var(--blue-soft);border:0;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.monthnav .btn2{width:40px;height:40px;padding:0}
.del{border-radius:999px}
/* 底部分頁：浮起來的白色膠囊，黑色指示塊滑動 */
nav{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 10px);border:0;border-radius:999px;background:var(--blue-soft);box-shadow:0 8px 28px rgba(0,0,0,.10);padding:6px;-webkit-backdrop-filter:none;backdrop-filter:none}
.tab{position:relative;z-index:1;border-radius:999px;padding:8px 0;font-size:11px;transition:color .3s}
.tab.active{color:var(--bg)!important}
#nav-ind{position:absolute;top:6px;bottom:6px;border-radius:999px;background:var(--text);transition:left .45s cubic-bezier(.3,1.25,.5,1),width .45s;z-index:0}
main{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
main section:not(.hidden){animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 今天還沒記帳 */
.pchip{border:0;background:var(--card)}
.pchip.later{background:transparent;border:1.5px dashed var(--line)}
/* 確認框、選單 */
.sheet{background:var(--blue-soft);border-radius:32px;padding:22px}
.cf-row{border-bottom:0;padding:9px 0}
.sheet-wrap{background:rgba(20,20,20,.3)}
.name-note{background:var(--card)}
.name-note.new{background:var(--card)}
.name-pick{background:var(--blue-soft)}
/* 統計 */
.stat.dark{background:#171717;color:#fff}
.stat.dark .lbl{color:#9a9a96}
#st-total{color:#fff}
.bar{height:10px;background:var(--blue-soft);border-radius:999px}
.bar>i{border-radius:999px;background:var(--blue-grad);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tgt .sub strong{color:var(--orange)}
/* 搜尋 */
.search-box input{background:var(--card);box-shadow:none;border-radius:999px}
.cus-row{background:var(--card);border:0;border-radius:22px}
.tag{background:var(--blue-soft)}
.code{background:var(--card);border:0}
/* 儲存成功提示：上方黑色膠囊彈下來 */
.toast{top:calc(env(safe-area-inset-top) + 14px);bottom:auto;display:flex;align-items:center;gap:8px;background:#171717;color:#fff;padding:10px 18px 10px 10px;transform:translate(-50%,-30px);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.toast.show{transform:translate(-50%,0)}
.toast::before{content:"✓";display:inline-flex;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#2a5bd7;align-items:center;justify-content:center;font-size:12px}
.toast.err::before{content:"!";background:#e5804a}
.toast.tap{pointer-events:auto;cursor:pointer}
.toast .undo{color:#8fb0ff;font-weight:600;margin-left:4px}
/* 目標圓環 */
.rings{display:flex;justify-content:space-around;gap:6px;margin:14px 0 6px}
.ring{position:relative;flex:1;max-width:110px;text-align:center}
.ring svg{display:block;width:84px;height:84px;margin:0 auto}
.ring .track{fill:none;stroke:var(--blue-soft);stroke-width:9}
.ring .prog{fill:none;stroke:var(--orange);stroke-width:9;stroke-linecap:round}
.ring .prog.done{stroke:var(--blue)}
.ring-num{position:absolute;left:0;right:0;top:30px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ring-name{display:block;margin-top:6px;font-size:13px;font-weight:600}
.ring small{display:block;font-size:11px;color:var(--muted)}
.tgt{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tgt .row1{margin-bottom:2px;font-weight:600}
/* ---------- 同步狀態 ---------- */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--card);border-radius:999px;padding:5px 10px;margin-left:auto;margin-right:8px;transition:color .3s}
.sync i{width:7px;height:7px;border-radius:50%;background:#2a5bd7;position:relative;transition:background .3s}
.sync i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;color:#2a5bd7;animation:ping 1.8s ease-out infinite}
.sync.busy i{background:#e5804a}.sync.busy i::after{color:#e5804a;animation-duration:.9s}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(1.7);opacity:0}}
/* ---------- 英文小標 ---------- */
.eyebrow{display:block;font-size:10px;letter-spacing:.16em;font-weight:600;color:var(--muted);margin-bottom:6px}
.stat.dark .eyebrow{color:#8a8a86}
/* ---------- 載入光澤 ---------- */
.skel{position:relative;overflow:hidden;background:var(--card)!important;color:transparent!important;box-shadow:none!important;border-radius:999px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:shimmer 1.15s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-num{display:inline-block;width:60%;height:30px;border-radius:10px}
/* ---------- 卡片依序浮上來 ---------- */
.rise{animation:rise .38s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
main section:not(.hidden){animation:none}
/* ---------- 月份切換滑動 ---------- */
.slide-l{animation:slideL .3s cubic-bezier(.2,.9,.3,1) both}
.slide-r{animation:slideR .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
/* ---------- 數字逐位滾動 ---------- */
.odo{display:inline-flex;overflow:hidden;line-height:1.15;vertical-align:bottom}
.odo .d{display:inline-block;height:1.15em;overflow:hidden}
.odo .d span{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.85,.25,1.04)}
.odo .d span i{font-style:normal;height:1.15em}
/* ---------- 舊客建議展開 ---------- */
.sug{animation:sugIn .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes sugIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- 今天還沒記帳：記完縮掉 ---------- */
.pchip{transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s,max-width .4s,padding .4s,margin .4s;max-width:300px}
.pchip.leaving{transform:scale(.4);opacity:0;max-width:0;padding-left:0;padding-right:0;margin-right:-8px}
.pchip:active{transform:scale(.94)}
/* ---------- 確認鈕變形：文字 → 轉圈 → 打勾 ---------- */
#cf-ok{transition:max-width .35s cubic-bezier(.3,1.2,.5,1),border-radius .35s,background .3s;max-width:400px;overflow:hidden;white-space:nowrap;position:relative}
#cf-ok.morph{max-width:56px;padding-left:0;padding-right:0;color:transparent}
#cf-ok.morph::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .6s linear infinite}
#cf-ok.morph.ok{background:#2a5bd7}
#cf-ok.morph.ok::after{border:0;animation:none;content:"✓";color:#fff;font-size:20px;line-height:20px;text-align:center;width:20px;height:20px;transform:scale(0);animation:okpop .35s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes okpop{to{transform:scale(1)}}
.sheet.out{animation:sheetOut .3s ease forwards}
.sheet-wrap.out{animation:fadeOut .3s ease forwards}
@keyframes sheetOut{to{opacity:0;transform:scale(.92) translateY(10px)}}
@keyframes fadeOut{to{opacity:0}}
/* ---------- 表單清空時淡一下 ---------- */
.clearing input,.clearing textarea,.clearing .chip.on{transition:opacity .25s}
.clearing input,.clearing textarea{opacity:.2}
/* ---------- 新紀錄滑進清單 ---------- */
.rec.new{animation:recIn .6s cubic-bezier(.2,.9,.3,1.15) both;box-shadow:0 0 0 2px var(--blue) inset}
@keyframes recIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}

.rec.pending{opacity:.7}
.rec .sync-tag{font-size:11px;color:var(--orange);font-weight:600;margin-left:6px}
.sync{cursor:pointer;border:0;font-family:inherit}
.sync.err i{background:#e5804a}.sync.err i::after{color:#e5804a;animation:none}
#cf-ok.morph{flex:0 0 56px}
.cf-btns .btn-ghost{transition:opacity .2s,flex .35s}

.form-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.form-head h2{margin-right:auto}
.clear-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--card);color:var(--muted);font:inherit;font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;margin-bottom:10px;transition:opacity .2s}
.clear-btn svg{width:13px;height:13px}
.clear-btn.off{opacity:0;pointer-events:none}
/* 底部標籤列當作畫面的底：內容捲到這裡就被蓋住 */
#nav-floor{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 80px);background:var(--bg);z-index:5;pointer-events:none}
.name-row{display:flex;gap:10px;align-items:flex-end}
.name-row .grow{flex:1;min-width:0}
.name-row .area{flex:none;width:96px}
.name-row .field{margin-bottom:0}
.area-sug{margin:10px 0 0}
.area-sug .code{background:var(--blue-soft);font-size:14px;padding:7px 12px}
.cus-area{display:inline-block;font-size:12px;font-weight:600;color:#2a5bd7;background:var(--blue-soft);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.more{margin-top:10px;background:var(--card-in,#fff);border-radius:18px;padding:10px;animation:sugIn .25s cubic-bezier(.2,.9,.3,1.1) both}
.more input{width:100%;box-sizing:border-box}
.more-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.more-list:empty{display:none}
.more-list .code{background:var(--card);border:0;font-size:14px;padding:8px 13px;border-radius:999px}
.more-list .code.new{background:transparent;border:1.5px dashed #e5804a;color:#c4622d;font-weight:600}
.chip.on.long{grid-column:span 2;font-size:14px;letter-spacing:0}
.more .hint{font-size:12px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-color-scheme:dark){.stat.dark{background:linear-gradient(135deg,#3a5fc4,#24409a)}.stat.dark .lbl{color:#c7d3f5}}
</style>
</head>
<body>

<!-- 登入畫面 -->
<section id="login" class="hidden">
  <picture>
    <source srcset="logo-mark-dark.png" media="(prefers-color-scheme: dark)">
    <img src="logo-mark.png" alt="Luff atelier">
  </picture>
  <form id="login-form">
    <input type="password" id="pw" placeholder="工作室密碼" autocomplete="current-password" enterkeyhint="go">
    <button class="submit" id="login-btn">進入</button>
    <p id="login-msg"></p>
  </form>
</section>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <header>
    <picture class="brand">
      <source srcset="logo-mark-dark.png" media="(prefers-color-scheme: dark)">
      <img src="logo-mark.png" alt="Luff atelier">
    </picture>
    <button type="button" class="sync" id="sync"><i></i><b>已同步</b></button>
    <button class="icon-btn" id="refresh" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <section id="view-form">
      <div class="form-head">
        <h2 id="form-title">新增紀錄</h2>
        <button type="button" class="clear-btn" id="clear-form" aria-label="清除表單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>清除</button>
      </div>
      <div class="pend hidden" id="pend">
        <div class="pend-head"><b>今天還沒記帳</b><span>點名字帶入</span></div>
        <div class="pend-chips" id="pend-chips"></div>
      </div>
      <div class="editbar hidden" id="editbar">
        <span id="edit-label">正在修改</span>
        <button type="button" class="btn2 small" id="cancel-edit">取消修改</button>
      </div>
      <div class="card">
        <div class="field"><label class="lbl" for="date">日期</label><input type="date" id="date"></div>
        <div class="name-row">
          <div class="field grow">
            <label class="lbl" for="name">客人姓名 *</label>
            <input id="name" autocomplete="off" placeholder="輸入姓名可找舊客">
          </div>
          <div class="field area">
            <label class="lbl" for="area">地區</label>
            <input id="area" autocomplete="off" placeholder="選填" maxlength="10">
          </div>
        </div>
        <div class="codes area-sug" id="area-sug"></div>
        <div id="suggest" class="suggest"></div>
      </div>
      <div class="card">
        <div class="field"><span class="lbl">項目 *（可複選，長按可刪除）</span><div class="chips" id="chips-items">載入中…</div><div class="more hidden" id="more-items"></div></div>
        <div class="field"><span class="lbl">款式（可複選，長按可刪除）</span><div class="chips" id="chips-styles"></div><div class="more hidden" id="more-styles"></div></div>
      </div>
      <div class="card">
        <div class="field"><label class="lbl" for="amount">金額 *</label><input type="number" id="amount" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="field"><span class="lbl">付款方式 *</span><div class="chips" id="chips-payment"></div><div class="more hidden" id="more-payment"></div></div>
        <div class="field">
          <label class="lbl" for="note">備註（打色號開頭會跳出建議）</label>
          <div class="codes" id="codes"></div>
          <textarea id="note" rows="3" autocapitalize="characters" autocorrect="off" spellcheck="false"></textarea>
        </div>
      </div>
      <button class="submit" id="submit">儲存紀錄</button>
    </section>

    <section id="view-recent" class="hidden">
      <h2>最近紀錄</h2>
      <div id="recent"></div>
    </section>

    <section id="view-customers" class="hidden">
      <h2>搜尋客人</h2>
      <div id="cus-search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="cus-q" type="search" placeholder="輸入客人姓名或姓氏" autocomplete="off" enterkeyhint="search">
        </div>
        <div id="cus-results"></div>
        <div id="cus-empty">
          <div class="card cus-hero">
            <div class="blobs"><i></i><i></i></div>
            <p class="hero-title">找找看是哪位客人</p>
            <p class="hero-sub">輸入姓名或姓氏，就能看到她的來店紀錄、<br>常用色號和款式</p>
          </div>
          <div class="cus-stats">
            <div class="card"><span>全部客人</span><b id="cs-all">0</b><small>曾經來過</small></div>
            <div class="card"><span>本月來過</span><b id="cs-month">0</b><small id="cs-month-sub">這個月</small></div>
            <div class="card"><span>熟客</span><b id="cs-loyal">0</b><small>來過 3 次以上</small></div>
          </div>
        </div>
      </div>
      <div id="cus-detail" class="hidden"></div>
    </section>

    <section id="view-stats" class="hidden">
      <div class="monthnav">
        <button type="button" class="btn2" id="prev-month" aria-label="上個月">‹</button>
        <strong id="month-label"></strong>
        <button type="button" class="btn2" id="next-month" aria-label="下個月">›</button>
      </div>
      <div class="card stat dark"><div class="lbl">總金額</div><div class="big" id="st-total">$0</div></div>
      <div class="stats2">
        <div class="card stat"><div class="lbl">人次</div><div class="big" id="st-count">0</div></div>
        <div class="card stat"><div class="lbl">客單價平均</div><div class="big" id="st-avg">$0</div></div>
      </div>
      <div class="card hidden" id="targets"></div>
      <button class="logout" id="logout">登出這支手機</button>
    </section>
  </main>

  <div id="nav-floor"></div>
  <nav>
    <div id="nav-ind"></div>
    <button class="tab active" data-tab="form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新增
    </button>
    <button class="tab" data-tab="recent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>紀錄
    </button>
    <button class="tab" data-tab="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>搜尋
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>統計
    </button>
  </nav>
</div>

<div id="confirm" class="sheet-wrap hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <h3 id="cf-title">確認這筆紀錄</h3>
    <div id="cf-body"></div>
    <div class="cf-btns">
      <button type="button" class="btn-ghost" id="cf-back">返回修改</button>
      <button type="button" class="submit" id="cf-ok">確認儲存</button>
    </div>
  </div>
</div>

<div id="actions" class="sheet-wrap hidden">
  <div class="sheet act" role="dialog" aria-modal="true" aria-labelledby="act-title">
    <h3 id="act-title"></h3>
    <p id="act-sub"></p>
    <button type="button" class="submit" id="act-edit">修改這筆紀錄</button>
    <button type="button" class="del" id="act-delete">刪除這筆紀錄</button>
    <button type="button" class="btn-ghost" id="act-cancel">取消</button>
  </div>
</div>

<button type="button" id="update-bar" class="hidden">有新版本，點這裡更新</button>
<div class="toast" id="toast"></div>

<script>
/* ===== 版本：每次修改都要改這個號碼，App 才會自動更新 ===== */
const APP_VERSION = '2026-11-14.3';

/* ===== 設定：後端網址（Google Apps Script 的 /exec） ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz4-ZBe-xScpWE8vLUwiDlgCP8nnq4eaQ_R9haYedfuj-r3UBfizrq6-kBrDv2bTzSkhw/exec';

const TYPES = { items: '項目', styles: '款式', payment: '付款方式' };
const MULTI = { items: true, styles: true, payment: false };
const state = { options: {}, usage: {}, colors: [], aliases: {}, customers: [], recent: [], monthly: {}, targets: { list: [], booked: 0 }, today: '', month: '', sel: { items: new Set(), styles: new Set(), payment: new Set() } };
const $ = id => document.getElementById(id);

/* ----- 手機端儲存（登入憑證、上次資料，讓開啟更快） ----- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, onTap) {
  const t = $('toast');
  t.textContent = msg;
  t.onclick = onTap ? () => { t.classList.remove('show'); t.onclick = null; onTap(); } : null;
  t.classList.toggle('tap', !!onTap);
  t.classList.toggle('err', /失敗|錯誤|請|無法|找不到/.test(msg));   // 錯誤用橘色驚嘆號
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.classList.remove('show'); t.onclick = null; t.classList.remove('tap'); }, onTap ? 4000 : 2400);
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ----- 呼叫後端 ----- */
async function api(action, payload) {
  const body = Object.assign({ action: action, token: store.get('luff_token') || '' }, payload || {});
  let res;
  try {
    // 用純文字送出，避免瀏覽器多做一次跨網域預檢
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  } catch (e) {
    throw new Error('連不上網路，請稍後再試');
  }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('伺服器回應異常，請確認後端已部署成「任何人」可存取'); }
  if (!json.ok) {
    if (json.error === 'UNAUTHORIZED') { showLogin('密碼已更改，請重新輸入'); throw new Error('請重新登入'); }
    throw new Error(json.error || '發生錯誤');
  }
  return json.data;
}

/* ----- 登入 ----- */
function showLogin(msg) {
  store.del('luff_token');
  store.del('luff_cache');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  const p = $('login-msg');
  p.textContent = msg || '';
  p.classList.toggle('err', !!msg);
}
$('login-form').onsubmit = async e => {
  e.preventDefault();
  const pw = $('pw').value;
  if (!pw) return;
  const btn = $('login-btn');
  btn.disabled = true;
  btn.textContent = '確認中…';
  try {
    const d = await api('login', { password: pw });
    store.set('luff_token', d.token);
    $('pw').value = '';
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    setTimeout(placeNavIndicator, 0);
    await load();
  } catch (err) {
    $('login-msg').textContent = err.message;
    $('login-msg').classList.add('err');
  } finally {
    btn.disabled = false;
    btn.textContent = '進入';
  }
};
$('logout').onclick = () => {
  if (confirm('要登出這支手機嗎？之後要重新輸入密碼。')) showLogin('');
};

/* ----- 載入資料 ----- */
async function load() {
  const btn = $('refresh');
  btn.classList.add('spin');
  if (!flushing) setSync('busy');
  try {
    const d = await api('init');
    store.set('luff_cache', JSON.stringify(d));
    applyData(withQueue(d));
    lastSync = Date.now();
    if (!flushing) setSync(getQueue().length ? 'err' : 'ok');
  } catch (e) {
    if (!flushing) setSync('err');
    if (e.message !== '請重新登入') toast('載入失敗：' + e.message);
  } finally {
    btn.classList.remove('spin');
    $('app').classList.remove('loading');
  }
  flushQueue();
}
$('refresh').onclick = load;

function applyData(d) {
  state.options = d.options || {};
  state.usage = d.usage || {};
  state.colors = d.colors || [];
  state.aliases = d.aliases || {};
  state.todayBookings = d.todayBookings || [];
  renderNowBooking();
  state.sortCache = {};
  state.customers = d.customers || [];
  state.recent = d.recent || [];
  state.monthly = d.monthly || {};
  state.targets = d.targets || { list: [], booked: 0 };
  state.today = todayStr();
  if (!state.month) state.month = state.today.slice(0, 7);
  if (!$('date').value) $('date').value = state.today;
  Object.keys(TYPES).forEach(renderChips);
  renderCodes();
  renderRecent();
  renderCusStats();
  renderStats();
}

/* ----- 選單 ----- */
function renderChips(key) {
  const box = $('chips-' + key);
  const sel = state.sel[key];
  const all = sortByUsage(TYPES[key], state.options[TYPES[key]] || []);
  // 項目、款式只顯示最常用的 8 個，其他的從「＋ 其他」搜尋
  const base = MULTI[key] ? all.slice(0, TOP_N) : all;
  // 已選但沒顯示的（從「其他」選的、或修改舊紀錄時的舊名稱）也要顯示出來
  const list = base.concat([...sel].filter(v => base.indexOf(v) === -1));
  box.innerHTML = list.map(v =>
    `<button type="button" class="chip${sel.has(v) ? ' on' : ''}${labelWidth(v) > 6 ? ' long' : ''}" data-v="${esc(v)}">${esc(v)}</button>`
  ).join('') + '<button type="button" class="chip add">＋ 其他</button>';
  box.querySelector('.chip.add').onclick = () => openMore(key);
  box.querySelectorAll('.chip:not(.add)').forEach(b => {
    // 短按 = 選取；長按 0.6 秒 = 刪除選項

/* 字比較多的按鈕用小一點的字（中文算 2、英數算 1） */
function labelWidth(s) {
  return [...String(s)].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
}
/* 常用的排前面：用過次數多的在左邊，次數相同時照選單設定的順序 */
function usageCount(type, v) {
  const u = state.usage[type] || {};
  let n = u[v] || 0;
  // 匯入的舊紀錄是手寫文字（以 ~ 開頭），用「包含」比對
  Object.keys(u).forEach(k => { if (k[0] === '~' && k.toLowerCase().includes(v.toLowerCase())) n += u[k]; });
  return n;
}
function sortByUsage(type, list) {
  if (!state.sortCache) state.sortCache = {};
  const key = type + '|' + list.join('|');
  if (!state.sortCache[key]) {
    state.sortCache[key] = list
      .map((v, i) => ({ v: v, i: i, n: usageCount(type, v) }))
      .sort((a, b) => b.n - a.n || a.i - b.i)
      .map(x => x.v);
  }
  return state.sortCache[key];
}
function toggle(key, v) {
  const sel = state.sel[key];
  if (MULTI[key]) {
    sel.has(v) ? sel.delete(v) : sel.add(v);
  } else {
    const had = sel.has(v);
    sel.clear();
    if (!had) sel.add(v);
  }
  renderChips(key);
  const n = $('chips-' + key).querySelector('.chip[data-v="' + CSS.escape(v) + '"]');
  if (n) n.classList.add('pop');   // 點下去彈一下
}

const TOP_N = 8;
function openMore(key) {

  listBox.querySelectorAll('.code').forEach(b => {

/* ----- 色號快速輸入 ----- */
const CODE_SEP = /[,，、\/／;；+\s]/;
function currentToken() {
  const ta = $('note');
  const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  let start = pos;
  while (start > 0 && !CODE_SEP.test(ta.value[start - 1])) start--;
  return { start: start, end: pos, text: ta.value.slice(start, pos).trim().toUpperCase() };
}
function renderCodes() {
  const box = $('codes');
  const note = $('note').value.toUpperCase();
  const used = new Set(note.split(CODE_SEP).map(s => s.trim()).filter(Boolean));
  const tok = currentToken().text;
  // 只有在備註裡打字時才跳出，沒打字就不顯示
  if (tok.length < 2 || document.activeElement !== $('note')) { box.innerHTML = ''; return; }   // 打到 2 個字才跳
  const starts = state.colors.filter(c => c.startsWith(tok) && c !== tok);
  const contains = state.colors.filter(c => !c.startsWith(tok) && c.includes(tok));
  const list = starts.concat(contains).filter(c => !used.has(c)).slice(0, 8);
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = list.map(c => `<button type="button" class="code" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  box.querySelectorAll('.code').forEach(b => {
    // 按下時不讓輸入框失去焦點，鍵盤才不會收起來
    b.addEventListener('mousedown', e => e.preventDefault());
    b.onclick = () => insertCode(b.dataset.c);
  });
}
let noteBlurAt = 0;
$('note').addEventListener('blur', () => {
  noteBlurAt = Date.now();
  // 稍等一下再收起，讓點選色號的動作來得及完成
  setTimeout(() => { if (document.activeElement !== $('note')) $('codes').innerHTML = ''; }, 350);
});
function insertCode(code) {
  const ta = $('note');
  const wasTyping = document.activeElement === ta || Date.now() - noteBlurAt < 400;
  const t = currentToken();
  const before = ta.value.slice(0, t.start);
  const after = ta.value.slice(t.end);
  const sep = before && !/[,，\s]$/.test(before) ? ', ' : '';
  const insert = sep + code + ', ';
  ta.value = before + insert + after.replace(/^[,，\s]+/, '');
  const caret = (before + insert).length;
  if (wasTyping) ta.focus();
  try { ta.setSelectionRange(caret, caret); } catch (e) {}
  $('codes').innerHTML = '';   // 加入後收起，等下一次打字再跳出
}
['input', 'click', 'keyup', 'focus'].forEach(ev => $('note').addEventListener(ev, renderCodes));

/* 長按 0.5 秒觸發；手指移動超過一點點（在捲動）就取消 */
function attachLongPress(el, fn) {
  let timer = null, x = 0, y = 0;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('pressing'); };
  el.addEventListener('pointerdown', e => {
    x = e.clientX; y = e.clientY;
    el.classList.add('pressing');
    timer = setTimeout(() => { cancel(); if (navigator.vibrate) navigator.vibrate(10); fn(); }, 500);
  });
  el.addEventListener('pointermove', e => { if (timer && (Math.abs(e.clientX - x) > 8 || Math.abs(e.clientY - y) > 8)) cancel(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ----- 月統計與目標 ----- */
/* 數字一位一位滾動到新的值（像計數器） */
/* 進統計頁時：數字從 0 重新滾一次 */
function replayNumbers() {
  [['st-total', '$'], ['st-count', ''], ['st-avg', '$']].forEach(([id, prefix]) => {
    const el = $(id);
    if (el.dataset.v === undefined) return;
    el.querySelectorAll('.odo .d > span').forEach(s => { s.style.transition = 'none'; s.style.transitionDelay = '0ms'; s.style.transform = 'translateY(0)'; });
    void el.offsetHeight;
    el.querySelectorAll('.odo .d > span').forEach(s => { s.style.transition = ''; });
    rollNumber(el, Number(el.dataset.v), prefix);
  });
}
function rollNumber(el, to, prefix) {
  el.dataset.v = to;
  const text = prefix + to.toLocaleString();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; return; }
  const chars = [...text];
  let wrap = el.querySelector('.odo');
  if (!wrap || wrap.dataset.len != chars.length) {
    el.innerHTML = '<span class="odo" data-len="' + chars.length + '">' + chars.map(c => /\d/.test(c)
      ? '<span class="d"><span>' + '0123456789'.split('').map(n => '<i>' + n + '</i>').join('') + '</span></span>'
      : '<span class="c">' + c + '</span>').join('') + '</span>';
    wrap = el.querySelector('.odo');
    void wrap.offsetHeight;
  }
  let k = 0;
  wrap.childNodes.forEach((n, i) => {
    const c = chars[i];
    if (n.classList.contains('d')) {
      n.firstChild.style.transitionDelay = (k++ * 35) + 'ms';
      n.firstChild.style.transform = 'translateY(-' + (Number(c) * 1.15) + 'em)';
    } else n.textContent = c;
  });
}
/* 圓環從 0 轉到目前的達成率，中間的數字一起跑 */
function animateRings() {
  document.querySelectorAll('#targets .ring').forEach(el => {
    const pct = Number(el.dataset.pct) || 0;
    const prog = el.querySelector('.prog'), num = el.querySelector('.ring-num');
    const C = Number(prog.getAttribute('stroke-dasharray'));
    prog.style.transition = 'none';
    prog.style.strokeDashoffset = C;
    num.textContent = '0%';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      prog.style.strokeDashoffset = C * (1 - Math.min(1, pct));
      num.textContent = Math.round(pct * 100) + '%';
      return;
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      prog.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
      prog.style.strokeDashoffset = C * (1 - Math.min(1, pct));
    }));
    const t0 = performance.now(), dur = 1100, to = Math.round(pct * 100);
    cancelAnimationFrame(el._raf);
    const step = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      num.textContent = Math.round(to * e) + '%';
      if (p < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  });
}
function renderStats() {
  const [y, m] = state.month.split('-').map(Number);
  const s = state.monthly[state.month] || { total: 0, count: 0 };
  const avg = s.count ? Math.round(s.total / s.count) : 0;
  $('month-label').textContent = y + ' 年 ' + m + ' 月';
  $('st-total').textContent = '$' + s.total.toLocaleString();
  $('st-count').textContent = s.count.toLocaleString();
  rollNumber($('st-total'), s.total, '$');
  rollNumber($('st-count'), s.count, '');
  rollNumber($('st-avg'), avg, '$');
  renderTargets(s);
}
function daysLeft(ym) {
  const [y, m] = ym.split('-').map(Number);
  const [ty, tm, td] = state.today.split('-').map(Number);
  const today = new Date(ty, tm - 1, td);
  const first = new Date(y, m - 1, 1);
  const last = new Date(y, m, 0);
  if (today > last) return 0;
  if (today < first) return last.getDate();
  return last.getDate() - td;   // 跟儀表板算法一樣，不含今天
}
function renderTargets(s) {
  const box = $('targets');
  const t = state.targets;
  if (!t.list.length) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const left = daysLeft(state.month);
  const isThisMonth = state.month === state.today.slice(0, 7);
  const avg = s.count ? s.total / s.count : 0;
  const forecastTotal = s.total + t.booked * avg;

  let html = `<div class="lbl">目標進度${left ? '・這個月還剩 ' + left + ' 天' : ''}</div>`;
  // 上方：每個目標一個圓環
  const R = 34, C = 2 * Math.PI * R;
  html += '<div class="rings">' + t.list.map(g => {
    const pct = s.total / g.amount;
    return `<div class="ring" data-pct="${pct}">
      <svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="${R}"/>
        <circle class="prog${pct >= 1 ? ' done' : ''}" cx="42" cy="42" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 42 42)"/></svg>
      <b class="ring-num">0%</b>
      <span class="ring-name">${esc(g.name)}</span>
      <small>$${g.amount.toLocaleString()}</small>
    </div>`;
  }).join('') + '</div>';
  // 下方：每個目標的細節
  html += t.list.map(g => {
    const gap = Math.max(0, g.amount - s.total);
    const daily = left && gap ? Math.round(gap / left) : 0;
    let fc = '';
    if (isThisMonth && gap) {
      const fPct = forecastTotal / g.amount;
      const fGap = Math.max(0, g.amount - forecastTotal);
      const need = avg ? Math.ceil(fGap / avg) : 0;
      fc = `<div class="sub">照預約預估 ${(fPct * 100).toFixed(0)}%` +
        (fGap ? `，還要再約 <strong>${need}</strong> 位` : '，可以達成') + '</div>';
    }
    return `<div class="tgt">
      <div class="row1"><span>${esc(g.name)}</span></div>
      <div class="sub">${gap ? '還差 $' + gap.toLocaleString() + (daily ? '・每天平均需 $' + daily.toLocaleString() : '') : '已達成'}</div>
      ${fc}
    </div>`;
  }).join('');
  if (isThisMonth) {
    html += `<div class="fc"><div class="row1"><span>預約中（已約未收費）<strong>${t.booked}</strong> 人</span>` +
      (t.auto ? `<span style="font-size:12px;color:var(--muted)">依日曆自動計算</span></div>`
              : `<button type="button" class="btn2 small" id="edit-booked">修改</button></div>`) +
      `<div>依目前客單價，預估月底約 $${Math.round(forecastTotal).toLocaleString()}</div></div>`;
  }
  box.innerHTML = html;
  animateRings();
  const btn = $('edit-booked');
  if (btn) btn.onclick = editBooked;
}

/* 儲存前確認 */
/* 姓名檢查：確保用的是系統裡的名字 */
function nameCheck(name) {
  const n = name.trim();
  const low = n.toLowerCase();
  const list = state.customers;
  if (state.aliases[n]) return { type: 'alias', to: [state.aliases[n]] };          // 已統一的舊名字
  if (list.some(c => c.name === n)) return { type: 'ok' };                         // 系統裡已經有
  const exactCase = list.find(c => c.name.toLowerCase() === low);                  // 只差大小寫（lynn／Lynn）
  if (exactCase) return { type: 'similar', to: [exactCase.name] };
  const chars = [...n];
  const score = c => {
    if (c.name.includes(n) || n.includes(c.name)) return 10;                       // 佩玲／廖佩玲
    return [...new Set(chars)].filter(ch => c.name.includes(ch)).length;            // 有幾個字一樣
  };
  const similar = list
    .map(c => ({ c: c, s: score(c) }))
    .filter(x => x.s >= 10 || (x.s >= 2 && chars.length >= 2))
    .sort((a, b) => b.s - a.s || b.c.count - a.c.count)
    .slice(0, 3)
    .map(x => x.c.name);
  return similar.length ? { type: 'similar', to: similar } : { type: 'new' };
}
function nameNotice(rec) {
  const chk = nameCheck(rec.name);
  if (chk.type === 'ok') return '';
  if (chk.type === 'new') return `<div class="name-note new">「${esc(rec.name)}」是<b>新客人</b>，系統裡還沒有這個名字</div>`;
  const msg = chk.type === 'alias'
    ? `「${esc(rec.name)}」已經統一成下面的名字，請改用：`
    : `系統裡沒有「${esc(rec.name)}」，是不是這位？`;
  return `<div class="name-note">${msg}<div class="name-picks">` +
    chk.to.map(n => `<button type="button" class="name-pick" data-n="${esc(n)}">${esc(n)}</button>`).join('') +
    (chk.type === 'similar' ? `<button type="button" class="name-pick keep">都不是，是新客人</button>` : '') +
    `</div></div>`;
}

/* ----- 同步狀態 ----- */
let lastSync = 0;
function setSync(mode) {
  const el = $('sync');
  el.classList.toggle('busy', mode === 'busy');
  el.classList.toggle('err', mode === 'err');
  const n = getQueue().length;
  el.querySelector('b').textContent =

    '已同步' + (lastSync ? '・' + agoText(lastSync) : '');
}
function agoText(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  return m < 1 ? '剛剛' : m < 60 ? m + ' 分鐘前' : Math.floor(m / 60) + ' 小時前';
}

/* ----- 待送出的紀錄：先存在手機，送成功才移除，不怕沒網路 ----- */
function getQueue() { try { return JSON.parse(store.get('luff_queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { store.set('luff_queue', JSON.stringify(q)); }
/* 把還沒送到的紀錄合併進畫面上的資料 */
function withQueue(d) {
  const q = getQueue();
  if (!q.length) return d;
  const have = new Set((d.recent || []).map(r => r.id));
  const extra = q.filter(x => !have.has(x.rec.cid)).map(x => ({
    id: x.rec.cid, date: x.rec.date, name: x.rec.name, items: x.rec.items.join('、'), styles: x.rec.styles.join('、'),
    amount: Number(x.rec.amount), payment: x.rec.payment, note: x.rec.note, area: x.rec.area || '', pending: true
  }));
  const monthly = Object.assign({}, d.monthly);
  extra.forEach(r => {
    const ym = r.date.slice(0, 7);
    monthly[ym] = { total: ((monthly[ym] || {}).total || 0) + r.amount, count: ((monthly[ym] || {}).count || 0) + 1 };
  });
  return Object.assign({}, d, { recent: extra.reverse().concat(d.recent || []), monthly: monthly });
}
let flushing = false;
async function flushQueue() {
  if (flushing) return;
  let q = getQueue();
  if (!q.length) return;
  flushing = true;
  setSync('busy');
  try {
    while (q.length) {
      const d = await api('save', { record: q[0].rec });   // 同一個編號重送，後端不會重複記
      q = getQueue().filter(x => x.rec.cid !== q[0].rec.cid);
      setQueue(q);
      store.set('luff_cache', JSON.stringify(d));
      if (!q.length) { applyData(d); }
    }
    lastSync = Date.now();
    setSync('ok');
  } catch (e) {
    setSync('err');
    if (e.message !== '請重新登入') toast('目前無法送出，紀錄已先存在手機，有網路會自動補送');
  } finally {
    flushing = false;
  }
}
window.addEventListener('online', flushQueue);

});

/* ----- 自動檢查新版本 ----- */
/* ----- 清除：按一下清空（日期保留），4 秒內點提示可以復原 ----- */
function updateClearBtn() {
  const has = !!($('name').value || $('amount').value || $('note').value || $('area').value || Object.values(state.sel).some(s => s.size));
  $('clear-form').classList.toggle('off', !has);
}
$('clear-form').onclick = () => {
  const snap = {
    name: $('name').value, amount: $('amount').value, note: $('note').value, area: $('area').value,
    sel: Object.fromEntries(Object.entries(state.sel).map(([k, s]) => [k, [...s]])), pendingKey: state.pendingKey
  };
  $('view-form').classList.add('clearing');
  setTimeout(() => {
    resetForm();
    $('view-form').classList.remove('clearing');
    toast('已清除・點這裡復原', () => {
      $('name').value = snap.name; $('amount').value = snap.amount; $('note').value = snap.note; $('area').value = snap.area;
      Object.entries(snap.sel).forEach(([k, arr]) => { state.sel[k].clear(); arr.forEach(v => state.sel[k].add(v)); });
      state.pendingKey = snap.pendingKey;
      Object.keys(TYPES).forEach(renderChips);
      renderCodes(); updateClearBtn();
      toast('已復原');
    });
  }, 180);
};
['input', 'click'].forEach(ev => $('view-form').addEventListener(ev, e => {
  if (e.target.id !== 'clear-form') setTimeout(updateClearBtn, 0);
}));
function formDirty() {
  return !!($('name').value || $('amount').value || $('note').value || state.editingId ||
    Object.values(state.sel).some(s => s.size));
}
async function checkUpdate() {
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION) return;
    const go = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    if (!formDirty()) return go();          // 沒有填到一半的資料，直接更新
    const bar = $('update-bar');            // 有填到一半，先提示，不打斷
    bar.classList.remove('hidden');
    bar.onclick = go;
  } catch (e) {}
}
checkUpdate();
</script>
