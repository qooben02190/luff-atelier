<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Luff atelier</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luff atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f9f4f0;--card:#fffdfa;--text:#1d1b19;--muted:#8b8378;--line:#e9e1d7;
  --blue:#2a5bd7;--blue-soft:#e4ebfb;--orange:#e5804a;--orange-soft:#fbe9dd;
  --serif:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614;--card:#211f1c;--text:#f1ece4;--muted:#9d968b;--line:#34312c;
  --blue:#7193f2;--blue-soft:#232f4c;--orange:#f0965f;--orange-soft:#3b2a20;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit}

/* 頂部 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:block;line-height:0}
.brand img{height:36px;width:auto}
.icon-btn{border:0;background:none;padding:6px;border-radius:999px;color:var(--muted);display:flex}
.icon-btn svg{width:22px;height:22px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 內容 */
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 92px);max-width:560px;margin:0 auto}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:4px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input,textarea{display:block;width:100%;max-width:100%;min-width:0;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:22px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.field{margin-bottom:16px}.field:last-child{margin-bottom:0}
/* 選項：整齊的四欄格子 */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 3px;font-size:14px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.long{font-size:12px;letter-spacing:-.02em}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.suggest{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.sug{text-align:left;border:1px solid var(--line);background:var(--blue-soft);border-radius:12px;padding:9px 12px;font-size:15px}
.sug small{color:var(--muted);font-size:12px}
.submit{width:100%;padding:15px;font-size:17px;font-weight:600;border:0;border-radius:14px;background:var(--text);color:var(--bg)}
.submit:disabled{opacity:.5}

.rec .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.rec .meta{color:var(--muted);font-size:13px;margin-top:4px}
.rec .note{font-size:14px;margin-top:6px}
.rec{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s,background .15s}
.rec.pressing{transform:scale(.98);background:var(--blue-soft)}
.search-box{position:relative}
.search-box svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted)}
.search-box input{padding-left:42px;height:48px;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.05)}
#cus-empty{margin-top:16px}
.cus-hero{text-align:center;padding:28px 20px 24px}
.blobs{position:relative;width:86px;height:70px;margin:0 auto 14px}
.blobs i{position:absolute;border-radius:50%;opacity:.92}
.blobs i:first-child{width:46px;height:60px;left:34px;top:0;background:var(--orange);transform:rotate(-12deg)}
.blobs i:last-child{width:44px;height:56px;left:8px;top:14px;background:var(--blue);transform:rotate(-28deg)}
.hero-title{margin:0;font-size:18px;font-weight:600}
.hero-sub{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.cus-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cus-stats .card{margin:0;padding:14px 12px;text-align:center}
.cus-stats span{display:block;font-size:12px;color:var(--muted)}
.cus-stats small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cus-stats b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.cus-stats .card:nth-child(2) b{color:var(--orange)}
.cus-stats .card:nth-child(3) b{color:var(--blue)}
#update-bar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 8px);z-index:30;border:0;border-radius:12px;padding:12px;background:var(--blue);color:#fff;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.back{border:0;background:none;color:var(--blue);font-size:15px;padding:4px 0 12px}
.cus-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px;font-size:16px}
.cus-row small{color:var(--muted);font-size:12px;white-space:nowrap}
#cus-results{margin-top:4px}
.cus-name{font-family:var(--serif);font-size:26px;margin-bottom:12px}
.cus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.cus-grid span{display:block;font-size:12px;color:var(--muted)}
.cus-grid b{font-size:16px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--orange-soft);border-radius:8px;padding:5px 9px;font-size:13px}
.tag small{color:var(--muted);margin-left:3px;font-size:11px}
.tags .none{font-size:13px;color:var(--muted)}
.more{display:block;width:100%;margin-top:4px}
#view-customers .rec{-webkit-user-select:auto;user-select:auto}
.rec-hint{margin:-6px 2px 12px;font-size:13px;color:var(--muted)}
.act{text-align:center}
.act h3{margin-bottom:2px}
.act p{margin:0 0 16px;color:var(--muted);font-size:14px}
.act button{display:block;width:100%;margin-top:10px}
.editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--blue-soft);border:1px solid var(--blue);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.del{display:block;width:100%;margin-top:10px;padding:13px;font-size:15px;border:1px solid #c4452e;color:#c4452e;background:none;border-radius:14px}
.del:disabled{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:32px}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav strong{font-family:var(--serif);font-weight:500;font-size:22px}
.btn2{border:1px solid var(--line);background:var(--card);border-radius:999px}
.monthnav .btn2{font-size:20px;line-height:1;padding:6px 16px}
.btn2.small{padding:5px 12px;font-size:13px}
.stats2{display:flex;gap:12px}.stats2>.card{flex:1;min-width:0}
.stat .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
#st-total{color:var(--orange)}
.tgt{margin-top:16px}
.tgt .row1{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.tgt .sub{font-size:13px;color:var(--muted);margin-top:5px}
.tgt .sub strong{color:var(--orange)}
.fc{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fc .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--text);font-size:14px;margin-bottom:4px}
.logout{display:block;margin:24px auto 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}

/* ===== 風格 B：藍橘主色 ===== */
:root{--line:#eee3d6}
h2{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:.02em}
h2::before{content:"";flex-shrink:0;width:14px;height:18px;border-radius:50%;background:var(--blue);transform:rotate(-20deg);box-shadow:8px -3px 0 -1px var(--orange)}
.monthnav strong{font-weight:600;font-size:18px}
.sheet h3,.cus-name{font-weight:600}
.submit{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(229,128,74,.28)}
.chip.on{background:var(--blue);border-color:var(--blue);box-shadow:0 3px 10px rgba(42,91,215,.22)}
.card{border:0;box-shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.05)}
.lbl{color:#9a8a7a}
.tab.active{color:var(--orange)}
.bar>i{background:linear-gradient(90deg,var(--blue),#5b82e6)}
@media (prefers-color-scheme:dark){
  :root{--line:#34312c}
  .card{border:1px solid var(--line);box-shadow:none}
  .lbl{color:var(--muted)}
  .submit{box-shadow:none}
}

/* 底部分頁列 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--orange)}

/* 登入 */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(env(safe-area-inset-bottom) + 32px);gap:18px}
#login img{width:min(66vw,260px);height:auto;display:block}
#login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#login p{margin:0;font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
#login p.err{color:#c4452e}

.codes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.codes:empty{display:none}
.code{border:1px solid var(--line);background:var(--orange-soft);border-radius:8px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.codes .hint{width:100%;font-size:12px;color:var(--muted)}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(20,18,16,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease-out}
.sheet{width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:var(--card);border-radius:22px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.18);animation:pop .26s cubic-bezier(.2,.9,.3,1.25)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-wrap{animation:none}}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 10px}
.cf-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.cf-row span:first-child{color:var(--muted);flex-shrink:0}
.cf-row span:last-child{text-align:right;overflow-wrap:anywhere}
.cf-btns{display:flex;gap:10px;margin-top:16px}
.cf-btns>*{flex:1}
.btn-ghost{padding:15px;font-size:17px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:10}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- 登入畫面 -->
<section id="login" class="hidden">
  <picture>
    <source srcset="logo-mark-dark.png" media="(prefers-color-scheme: dark)">
    <img src="logo-mark.png" alt="Luff atelier">
  </picture>
  <form id="login-form">
    <input type="password" id="pw" placeholder="工作室密碼" autocomplete="current-password" enterkeyhint="go">
    <button class="submit" id="login-btn">進入</button>
    <p id="login-msg"></p>
  </form>
</section>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <header>
    <picture class="brand">
      <source srcset="logo-mark-dark.png" media="(prefers-color-scheme: dark)">
      <img src="logo-mark.png" alt="Luff atelier">
    </picture>
    <button class="icon-btn" id="refresh" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <section id="view-form">
      <h2 id="form-title">新增紀錄</h2>
      <div class="editbar hidden" id="editbar">
        <span id="edit-label">正在修改</span>
        <button type="button" class="btn2 small" id="cancel-edit">取消修改</button>
      </div>
      <div class="card">
        <div class="field"><label class="lbl" for="date">日期</label><input type="date" id="date"></div>
        <div class="field">
          <label class="lbl" for="name">客人姓名 *</label>
          <input id="name" autocomplete="off" placeholder="輸入姓名可找舊客">
          <div id="suggest" class="suggest"></div>
        </div>
      </div>
      <div class="card">
        <div class="field"><span class="lbl">項目 *（可複選，長按可刪除）</span><div class="chips" id="chips-items">載入中…</div></div>
        <div class="field"><span class="lbl">款式（可複選，長按可刪除）</span><div class="chips" id="chips-styles"></div></div>
      </div>
      <div class="card">
        <div class="field"><label class="lbl" for="amount">金額 *</label><input type="number" id="amount" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="field"><span class="lbl">付款方式 *</span><div class="chips" id="chips-payment"></div></div>
        <div class="field">
          <label class="lbl" for="note">備註（打色號開頭會跳出建議）</label>
          <div class="codes" id="codes"></div>
          <textarea id="note" rows="3" autocapitalize="characters" autocorrect="off" spellcheck="false"></textarea>
        </div>
      </div>
      <button class="submit" id="submit">儲存紀錄</button>
    </section>

    <section id="view-recent" class="hidden">
      <h2>最近紀錄</h2>
      <div id="recent"></div>
    </section>

    <section id="view-customers" class="hidden">
      <h2>搜尋客人</h2>
      <div id="cus-search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="cus-q" type="search" placeholder="輸入客人姓名或姓氏" autocomplete="off" enterkeyhint="search">
        </div>
        <div id="cus-results"></div>
        <div id="cus-empty">
          <div class="card cus-hero">
            <div class="blobs"><i></i><i></i></div>
            <p class="hero-title">找找看是哪位客人</p>
            <p class="hero-sub">輸入姓名或姓氏，就能看到她的來店紀錄、<br>常用色號和款式</p>
          </div>
          <div class="cus-stats">
            <div class="card"><span>全部客人</span><b id="cs-all">0</b><small>曾經來過</small></div>
            <div class="card"><span>本月來過</span><b id="cs-month">0</b><small id="cs-month-sub">這個月</small></div>
            <div class="card"><span>熟客</span><b id="cs-loyal">0</b><small>來過 3 次以上</small></div>
          </div>
        </div>
      </div>
      <div id="cus-detail" class="hidden"></div>
    </section>

    <section id="view-stats" class="hidden">
      <div class="monthnav">
        <button type="button" class="btn2" id="prev-month" aria-label="上個月">‹</button>
        <strong id="month-label"></strong>
        <button type="button" class="btn2" id="next-month" aria-label="下個月">›</button>
      </div>
      <div class="card stat"><div class="lbl">總金額</div><div class="big" id="st-total">$0</div></div>
      <div class="stats2">
        <div class="card stat"><div class="lbl">人次</div><div class="big" id="st-count">0</div></div>
        <div class="card stat"><div class="lbl">客單價平均</div><div class="big" id="st-avg">$0</div></div>
      </div>
      <div class="card hidden" id="targets"></div>
      <button class="logout" id="logout">登出這支手機</button>
    </section>
  </main>

  <nav>
    <button class="tab active" data-tab="form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新增
    </button>
    <button class="tab" data-tab="recent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>紀錄
    </button>
    <button class="tab" data-tab="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>搜尋
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>統計
    </button>
  </nav>
</div>

<div id="confirm" class="sheet-wrap hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <h3 id="cf-title">確認這筆紀錄</h3>
    <div id="cf-body"></div>
    <div class="cf-btns">
      <button type="button" class="btn-ghost" id="cf-back">返回修改</button>
      <button type="button" class="submit" id="cf-ok">確認儲存</button>
    </div>
  </div>
</div>

<div id="actions" class="sheet-wrap hidden">
  <div class="sheet act" role="dialog" aria-modal="true" aria-labelledby="act-title">
    <h3 id="act-title"></h3>
    <p id="act-sub"></p>
    <button type="button" class="submit" id="act-edit">修改這筆紀錄</button>
    <button type="button" class="del" id="act-delete">刪除這筆紀錄</button>
    <button type="button" class="btn-ghost" id="act-cancel">取消</button>
  </div>
</div>

<button type="button" id="update-bar" class="hidden">有新版本，點這裡更新</button>
<div class="toast" id="toast"></div>

<script>
/* ===== 版本：每次修改都要改這個號碼，App 才會自動更新 ===== */
const APP_VERSION = '2026-11-11.3';

/* ===== 設定：後端網址（Google Apps Script 的 /exec） ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz4-ZBe-xScpWE8vLUwiDlgCP8nnq4eaQ_R9haYedfuj-r3UBfizrq6-kBrDv2bTzSkhw/exec';

const TYPES = { items: '項目', styles: '款式', payment: '付款方式' };
const MULTI = { items: true, styles: true, payment: false };
const state = { options: {}, usage: {}, colors: [], customers: [], recent: [], monthly: {}, targets: { list: [], booked: 0 }, today: '', month: '', sel: { items: new Set(), styles: new Set(), payment: new Set() } };
const $ = id => document.getElementById(id);

/* ----- 手機端儲存（登入憑證、上次資料，讓開啟更快） ----- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2400);
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ----- 呼叫後端 ----- */
async function api(action, payload) {
  const body = Object.assign({ action: action, token: store.get('luff_token') || '' }, payload || {});
  let res;
  try {
    // 用純文字送出，避免瀏覽器多做一次跨網域預檢
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  } catch (e) {
    throw new Error('連不上網路，請稍後再試');
  }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('伺服器回應異常，請確認後端已部署成「任何人」可存取'); }
  if (!json.ok) {
    if (json.error === 'UNAUTHORIZED') { showLogin('密碼已更改，請重新輸入'); throw new Error('請重新登入'); }
    throw new Error(json.error || '發生錯誤');
  }
  return json.data;
}

/* ----- 登入 ----- */
function showLogin(msg) {
  store.del('luff_token');
  store.del('luff_cache');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  const p = $('login-msg');
  p.textContent = msg || '';
  p.classList.toggle('err', !!msg);
}
$('login-form').onsubmit = async e => {
  e.preventDefault();
  const pw = $('pw').value;
  if (!pw) return;
  const btn = $('login-btn');
  btn.disabled = true;
  btn.textContent = '確認中…';
  try {
    const d = await api('login', { password: pw });
    store.set('luff_token', d.token);
    $('pw').value = '';
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await load();
  } catch (err) {
    $('login-msg').textContent = err.message;
    $('login-msg').classList.add('err');
  } finally {
    btn.disabled = false;
    btn.textContent = '進入';
  }
};
$('logout').onclick = () => {
  if (confirm('要登出這支手機嗎？之後要重新輸入密碼。')) showLogin('');
};

/* ----- 載入資料 ----- */
async function load() {
  const btn = $('refresh');
  btn.classList.add('spin');
  try {
    const d = await api('init');
    store.set('luff_cache', JSON.stringify(d));
    applyData(d);
  } catch (e) {
    if (e.message !== '請重新登入') toast('載入失敗：' + e.message);
  } finally {
    btn.classList.remove('spin');
  }
}
$('refresh').onclick = load;

function applyData(d) {
  state.options = d.options || {};
  state.usage = d.usage || {};
  state.colors = d.colors || [];
  state.sortCache = {};
  state.customers = d.customers || [];
  state.recent = d.recent || [];
  state.monthly = d.monthly || {};
  state.targets = d.targets || { list: [], booked: 0 };
  state.today = todayStr();
  if (!state.month) state.month = state.today.slice(0, 7);
  if (!$('date').value) $('date').value = state.today;
  Object.keys(TYPES).forEach(renderChips);
  renderCodes();
  renderRecent();
  renderCusStats();
  renderStats();
}

/* ----- 選單 ----- */
function renderChips(key) {
  const box = $('chips-' + key);
  const sel = state.sel[key];
  const base = sortByUsage(TYPES[key], state.options[TYPES[key]] || []);
  // 修改舊紀錄時，已選但不在選單裡的值（例如舊的「手卸光」）也要顯示出來
  const list = base.concat([...sel].filter(v => base.indexOf(v) === -1));
  box.innerHTML = list.map(v =>
    `<button type="button" class="chip${sel.has(v) ? ' on' : ''}${labelWidth(v) > 6 ? ' long' : ''}" data-v="${esc(v)}">${esc(v)}</button>`
  ).join('') + '<button type="button" class="chip add">＋ 新增</button>';
  box.querySelector('.chip.add').onclick = () => addOption(key);
  box.querySelectorAll('.chip:not(.add)').forEach(b => {
    // 短按 = 選取；長按 0.6 秒 = 刪除選項
    let timer = null, longPressed = false;
    const start = () => {
      longPressed = false;
      clearTimeout(timer);
      timer = setTimeout(() => { longPressed = true; removeOption(key, b.dataset.v); }, 600);
    };
    const cancel = () => clearTimeout(timer);
    b.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, cancel));
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.onclick = () => {
      if (longPressed) { longPressed = false; return; }
      toggle(key, b.dataset.v);
    };
  });
}
/* 字比較多的按鈕用小一點的字（中文算 2、英數算 1） */
function labelWidth(s) {
  return [...String(s)].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
}
/* 常用的排前面：用過次數多的在左邊，次數相同時照選單設定的順序 */
function usageCount(type, v) {
  const u = state.usage[type] || {};
  let n = u[v] || 0;
  // 匯入的舊紀錄是手寫文字（以 ~ 開頭），用「包含」比對
  Object.keys(u).forEach(k => { if (k[0] === '~' && k.toLowerCase().includes(v.toLowerCase())) n += u[k]; });
  return n;
}
function sortByUsage(type, list) {
  if (!state.sortCache) state.sortCache = {};
  const key = type + '|' + list.join('|');
  if (!state.sortCache[key]) {
    state.sortCache[key] = list
      .map((v, i) => ({ v: v, i: i, n: usageCount(type, v) }))
      .sort((a, b) => b.n - a.n || a.i - b.i)
      .map(x => x.v);
  }
  return state.sortCache[key];
}
function toggle(key, v) {
  const sel = state.sel[key];
  if (MULTI[key]) {
    sel.has(v) ? sel.delete(v) : sel.add(v);
  } else {
    const had = sel.has(v);
    sel.clear();
    if (!had) sel.add(v);
  }
  renderChips(key);
}
async function addOption(key) {
  const v = (prompt('新增' + TYPES[key]) || '').trim();
  if (!v) return;
  try {
    state.options = (await api('addOption', { type: TYPES[key], value: v })).options;
    if (!MULTI[key]) state.sel[key].clear();
    state.sel[key].add(v);
    renderChips(key);
    toast('已新增「' + v + '」');
  } catch (e) {
    toast('新增失敗：' + e.message);
  }
}
async function removeOption(key, v) {
  if (!confirm('要從選單刪除「' + v + '」嗎？\n已存的紀錄不會受影響。')) return;
  try {
    state.options = (await api('removeOption', { type: TYPES[key], value: v })).options;
    state.sel[key].delete(v);
    renderChips(key);
    toast('已刪除「' + v + '」');
  } catch (e) {
    toast('刪除失敗：' + e.message);
  }
}

/* ----- 色號快速輸入 ----- */
const CODE_SEP = /[,，、\/／;；+\s]/;
function currentToken() {
  const ta = $('note');
  const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  let start = pos;
  while (start > 0 && !CODE_SEP.test(ta.value[start - 1])) start--;
  return { start: start, end: pos, text: ta.value.slice(start, pos).trim().toUpperCase() };
}
function renderCodes() {
  const box = $('codes');
  const note = $('note').value.toUpperCase();
  const used = new Set(note.split(CODE_SEP).map(s => s.trim()).filter(Boolean));
  const tok = currentToken().text;
  // 只有在備註裡打字時才跳出，沒打字就不顯示
  if (tok.length < 2 || document.activeElement !== $('note')) { box.innerHTML = ''; return; }   // 打到 2 個字才跳
  const starts = state.colors.filter(c => c.startsWith(tok) && c !== tok);
  const contains = state.colors.filter(c => !c.startsWith(tok) && c.includes(tok));
  const list = starts.concat(contains).filter(c => !used.has(c)).slice(0, 8);
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = list.map(c => `<button type="button" class="code" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  box.querySelectorAll('.code').forEach(b => {
    // 按下時不讓輸入框失去焦點，鍵盤才不會收起來
    b.addEventListener('mousedown', e => e.preventDefault());
    b.onclick = () => insertCode(b.dataset.c);
  });
}
let noteBlurAt = 0;
$('note').addEventListener('blur', () => {
  noteBlurAt = Date.now();
  // 稍等一下再收起，讓點選色號的動作來得及完成
  setTimeout(() => { if (document.activeElement !== $('note')) $('codes').innerHTML = ''; }, 350);
});
function insertCode(code) {
  const ta = $('note');
  const wasTyping = document.activeElement === ta || Date.now() - noteBlurAt < 400;
  const t = currentToken();
  const before = ta.value.slice(0, t.start);
  const after = ta.value.slice(t.end);
  const sep = before && !/[,，\s]$/.test(before) ? ', ' : '';
  const insert = sep + code + ', ';
  ta.value = before + insert + after.replace(/^[,，\s]+/, '');
  const caret = (before + insert).length;
  if (wasTyping) ta.focus();
  try { ta.setSelectionRange(caret, caret); } catch (e) {}
  $('codes').innerHTML = '';   // 加入後收起，等下一次打字再跳出
}
['input', 'click', 'keyup', 'focus'].forEach(ev => $('note').addEventListener(ev, renderCodes));

/* ----- 客人分頁 ----- */
function renderCusResults() {
  const box = $('cus-results');
  const q = $('cus-q').value.trim().toLowerCase();
  $('cus-empty').classList.toggle('hidden', !!q);
  if (!q) { box.innerHTML = ''; renderCusStats(); return; }   // 沒打字就顯示概況
  const m = state.customers.filter(c => c.name.toLowerCase().includes(q)).slice(0, 20);
  if (!m.length) { box.innerHTML = '<div class="empty">找不到符合的客人</div>'; return; }
  box.innerHTML = m.map((c, i) =>
    `<button type="button" class="cus-row" data-i="${i}"><span>${esc(c.name)}</span>` +
    `<small>來店 ${c.count} 次 · 最近 ${esc(c.last)}</small></button>`).join('');
  box.querySelectorAll('.cus-row').forEach(b => { b.onclick = () => openCustomer(m[b.dataset.i].name); });
}
$('cus-q').addEventListener('input', renderCusResults);

async function openCustomer(name) {
  const box = $('cus-detail');
  $('cus-search-wrap').classList.add('hidden');
  box.classList.remove('hidden');
  box.innerHTML = `<button type="button" class="back" id="cus-back">‹ 返回搜尋</button><div class="empty">載入「${esc(name)}」的資料…</div>`;
  $('cus-back').onclick = closeCustomer;
  window.scrollTo(0, 0);
  try {
    const c = await api('customer', { name: name });
    renderCustomer(c, false);
  } catch (e) {
    box.querySelector('.empty').textContent = '載入失敗：' + e.message;
  }
}
function closeCustomer() {
  $('cus-detail').classList.add('hidden');
  $('cus-search-wrap').classList.remove('hidden');
  // 回到搜尋時清空，直接重新開始
  $('cus-q').value = '';
  renderCusResults();
  window.scrollTo(0, 0);
}
/* 搜尋頁還沒輸入時的客人概況 */
function renderCusStats() {
  const ym = (state.today || todayStr()).slice(0, 7);
  $('cs-all').textContent = state.customers.length;
  $('cs-month').textContent = state.customers.filter(c => String(c.last).slice(0, 7) === ym).length;
  $('cs-loyal').textContent = state.customers.filter(c => c.count >= 3).length;
  $('cs-month-sub').textContent = Number(ym.slice(5)) + ' 月';
}
function renderCustomer(c, showAll) {
  const box = $('cus-detail');
  const tags = list => list.length

    : '<span class="none">還沒有紀錄</span>';
  const visits = showAll ? c.visits : c.visits.slice(0, 5);
  box.innerHTML = `
    <button type="button" class="back" id="cus-back">‹ 返回搜尋</button>
    <div class="card">
      <div class="cus-name">${esc(c.name)}</div>
      <div class="cus-grid">
        <div><span>來店次數</span><b>${c.count} 次</b></div>
        <div><span>平均多久來一次</span><b>${c.interval ? '約 ' + c.interval + ' 天' : '—'}</b></div>
        <div><span>第一次來</span><b>${esc(c.first)}</b></div>
        <div><span>最近一次來</span><b>${esc(c.last)}</b></div>
        <div><span>累計消費</span><b>$${c.total.toLocaleString()}</b></div>
        <div><span>平均客單價</span><b>$${c.avg.toLocaleString()}</b></div>
      </div>
      <div class="lbl" style="margin-top:14px">最常用的色號</div><div class="tags">${tags(c.topColors)}</div>
      <div class="lbl" style="margin-top:12px">最常做的款式</div><div class="tags">${tags(c.topStyles)}</div>
    </div>
    <div class="lbl" style="margin:16px 2px 8px">過去紀錄（共 ${c.visits.length} 筆）</div>
    ${visits.map(v => `
      <div class="card rec">
        <div class="top"><span>${esc(v.date)}</span><span>$${v.amount.toLocaleString()}</span></div>
        <div class="meta">${esc([v.items, v.styles].filter(Boolean).join(' ／ '))}${v.payment ? ' · ' + esc(v.payment) : ''}</div>
        ${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}
      </div>`).join('')}
    ${!showAll && c.visits.length > 5 ? `<button type="button" class="btn-ghost more" id="cus-more">顯示全部 ${c.visits.length} 筆</button>` : ''}`;
  $('cus-back').onclick = closeCustomer;
  const more = $('cus-more');
  if (more) more.onclick = () => renderCustomer(c, true);
}

/* ----- 舊客建議 ----- */

  const box = $('suggest');
  const q = $('name').value.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const m = state.customers
    .filter(c => c.name.toLowerCase().includes(q) && c.name !== $('name').value.trim())

    `<small>來店 ${c.count} 次 · 最近 ${esc(c.last)} · 累計 $${c.total.toLocaleString()}</small></button>`
  ).join('');
  box.querySelectorAll('.sug').forEach(b => {
    b.onclick = () => { $('name').value = m[b.dataset.i].name; box.innerHTML = ''; };

$('name').addEventListener('input', renderSuggest);

/* ----- 最近紀錄 ----- */
function renderRecent() {
  const box = $('recent');
  if (!state.recent.length) { box.innerHTML = '<div class="empty">還沒有紀錄</div>'; return; }
  box.innerHTML = state.recent.map(r => `
    <div class="card rec">
      <div class="top"><span>${esc(r.name)}</span><span>$${Number(r.amount || 0).toLocaleString()}</span></div>
      <div class="meta">${esc(r.date)} · ${esc(r.payment || '未填付款方式')}</div>
      <div class="meta">${esc([r.items, r.styles].filter(Boolean).join(' ／ '))}</div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
    </div>`).join('');
  box.innerHTML = '<p class="rec-hint">長按紀錄可以修改或刪除</p>' + box.innerHTML;
  box.querySelectorAll('.rec').forEach((card, i) => attachLongPress(card, () => openActions(state.recent[i])));
}

/* 長按 0.5 秒觸發；手指移動超過一點點（在捲動）就取消 */
function attachLongPress(el, fn) {
  let timer = null, x = 0, y = 0;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('pressing'); };
  el.addEventListener('pointerdown', e => {
    x = e.clientX; y = e.clientY;
    el.classList.add('pressing');
    timer = setTimeout(() => { cancel(); if (navigator.vibrate) navigator.vibrate(10); fn(); }, 500);
  });
  el.addEventListener('pointermove', e => { if (timer && (Math.abs(e.clientX - x) > 8 || Math.abs(e.clientY - y) > 8)) cancel(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* 長按後跳出的選單 */
function openActions(r) {
  if (!r) return;
  state.actionRec = r;
  $('act-title').textContent = r.name;
  $('act-sub').textContent = r.date + '　$' + Number(r.amount || 0).toLocaleString();
  $('actions').classList.remove('hidden');
}
function closeActions() { $('actions').classList.add('hidden'); state.actionRec = null; }
$('act-cancel').onclick = closeActions;
$('actions').onclick = e => { if (e.target === $('actions')) closeActions(); };
$('act-edit').onclick = () => { const r = state.actionRec; closeActions(); startEdit(r); };
$('act-delete').onclick = async () => {
  const r = state.actionRec;
  if (!r) return;
  if (!confirm('確定要刪除「' + r.name + '　' + r.date + '　$' + Number(r.amount || 0).toLocaleString() + '」嗎？\n刪除後無法復原。')) return;
  const btn = $('act-delete');
  btn.disabled = true;
  btn.textContent = '刪除中…';
  try {
    const d = await api('delete', { id: r.id });
    store.set('luff_cache', JSON.stringify(d));
    applyData(d);
    closeActions();
    toast('已刪除');
  } catch (e) {
    toast('刪除失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '刪除這筆紀錄';
  }
};

/* ----- 修改／刪除 ----- */
function splitList(s) {
  return String(s || '').split('、').map(v => v.trim()).filter(Boolean);
}
function startEdit(r) {
  if (!r) return;
  state.editingId = r.id;
  $('date').value = r.date;
  $('name').value = r.name;
  $('amount').value = r.amount;
  $('note').value = r.note;
  state.sel.items = new Set(splitList(r.items));
  state.sel.styles = new Set(splitList(r.styles));
  state.sel.payment = new Set(r.payment ? [r.payment] : []);
  Object.keys(TYPES).forEach(renderChips);
  $('suggest').innerHTML = '';
  $('form-title').textContent = '修改紀錄';
  $('edit-label').textContent = '正在修改：' + r.name + '　' + r.date;
  $('editbar').classList.remove('hidden');
  $('submit').textContent = '更新紀錄';
  showTab('form');
}
function exitEdit() {
  state.editingId = null;
  $('form-title').textContent = '新增紀錄';
  $('editbar').classList.add('hidden');
  $('submit').textContent = '儲存紀錄';
}
$('cancel-edit').onclick = () => { exitEdit(); resetForm(); showTab('recent'); };


/* ----- 月統計與目標 ----- */
function renderStats() {
  const [y, m] = state.month.split('-').map(Number);
  const s = state.monthly[state.month] || { total: 0, count: 0 };
  const avg = s.count ? Math.round(s.total / s.count) : 0;
  $('month-label').textContent = y + ' 年 ' + m + ' 月';
  $('st-total').textContent = '$' + s.total.toLocaleString();
  $('st-count').textContent = s.count.toLocaleString();
  $('st-avg').textContent = '$' + avg.toLocaleString();
  renderTargets(s);
}
function daysLeft(ym) {
  const [y, m] = ym.split('-').map(Number);
  const [ty, tm, td] = state.today.split('-').map(Number);
  const today = new Date(ty, tm - 1, td);
  const first = new Date(y, m - 1, 1);
  const last = new Date(y, m, 0);
  if (today > last) return 0;
  if (today < first) return last.getDate();
  return last.getDate() - td;   // 跟儀表板算法一樣，不含今天
}
function renderTargets(s) {
  const box = $('targets');
  const t = state.targets;
  if (!t.list.length) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const left = daysLeft(state.month);
  const isThisMonth = state.month === state.today.slice(0, 7);
  const avg = s.count ? s.total / s.count : 0;
  const forecastTotal = s.total + t.booked * avg;

  let html = `<div class="lbl">目標進度${left ? '・這個月還剩 ' + left + ' 天' : ''}</div>`;
  html += t.list.map(g => {
    const pct = s.total / g.amount;
    const gap = Math.max(0, g.amount - s.total);
    const daily = left && gap ? Math.round(gap / left) : 0;
    let fc = '';
    if (isThisMonth && gap) {
      const fPct = forecastTotal / g.amount;
      const fGap = Math.max(0, g.amount - forecastTotal);
      const need = avg ? Math.ceil(fGap / avg) : 0;
      fc = `<div class="sub">照預約預估 ${(fPct * 100).toFixed(0)}%` +
        (fGap ? `，還要再約 <strong>${need}</strong> 位` : '，可以達成') + '</div>';
    }
    return `<div class="tgt">
      <div class="row1"><span>${esc(g.name)}　$${g.amount.toLocaleString()}</span><strong>${(pct * 100).toFixed(1)}%</strong></div>
      <div class="bar"><i style="width:${Math.min(100, pct * 100)}%"></i></div>
      <div class="sub">${gap ? '還差 $' + gap.toLocaleString() + (daily ? '・每天平均需 $' + daily.toLocaleString() : '') : '已達成'}</div>
      ${fc}
    </div>`;
  }).join('');
  if (isThisMonth) {
    html += `<div class="fc"><div class="row1"><span>預約中（已約未收費）<strong>${t.booked}</strong> 人</span>` +
      (t.auto ? `<span style="font-size:12px;color:var(--muted)">依日曆自動計算</span></div>`
              : `<button type="button" class="btn2 small" id="edit-booked">修改</button></div>`) +
      `<div>依目前客單價，預估月底約 $${Math.round(forecastTotal).toLocaleString()}</div></div>`;
  }
  box.innerHTML = html;
  const btn = $('edit-booked');
  if (btn) btn.onclick = editBooked;
}
async function editBooked() {
  const v = prompt('這個月預約中（已約未收費）的客人數', String(state.targets.booked));
  if (v === null) return;
  const n = Number(v.trim());
  if (!Number.isInteger(n) || n < 0) return toast('請輸入 0 以上的整數');
  try {
    const d = await api('setBooked', { value: n });
    store.set('luff_cache', JSON.stringify(d));
    applyData(d);
    toast('已更新為 ' + n + ' 人');
  } catch (e) {
    toast('更新失敗：' + e.message);
  }
}
function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  state.month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderStats();
}
$('prev-month').onclick = () => shiftMonth(-1);
$('next-month').onclick = () => shiftMonth(1);

/* ----- 儲存 ----- */
$('submit').onclick = () => {
  const rec = {
    date: $('date').value,
    name: $('name').value.trim(),
    items: [...state.sel.items],
    styles: [...state.sel.styles],
    amount: $('amount').value,
    payment: [...state.sel.payment][0] || '',
    note: $('note').value.trim()
  };
  if (!rec.date) return toast('請選日期');
  if (!rec.name) return toast('請填客人姓名');
  if (!rec.items.length) return toast('請選至少一個項目');
  if (rec.amount === '' || Number(rec.amount) < 0) return toast('請填金額');
  if (!rec.payment) return toast('請選付款方式');
  openConfirm(rec);
};

/* 儲存前確認 */
function openConfirm(rec) {
  const row = (k, v) => `<div class="cf-row"><span>${k}</span><span>${v}</span></div>`;
  $('cf-body').innerHTML =
    row('日期', esc(rec.date)) +
    row('客人', esc(rec.name)) +
    row('項目', esc(rec.items.join('、'))) +
    (rec.styles.length ? row('款式', esc(rec.styles.join('、'))) : '') +
    row('金額', '<strong>$' + Number(rec.amount).toLocaleString() + '</strong>') +
    row('付款', esc(rec.payment)) +
    (rec.note ? row('備註', esc(rec.note)) : '');
  state.pending = rec;
  $('cf-title').textContent = state.editingId ? '確認修改這筆紀錄' : '確認這筆紀錄';
  $('cf-ok').textContent = state.editingId ? '確認更新' : '確認儲存';
  $('confirm').classList.remove('hidden');
}
function closeConfirm() {
  $('confirm').classList.add('hidden');
  state.pending = null;
}
$('cf-back').onclick = closeConfirm;
$('confirm').onclick = e => { if (e.target === $('confirm')) closeConfirm(); };
$('cf-ok').onclick = async () => {
  const rec = state.pending;
  if (!rec) return;
  const ok = $('cf-ok'), back = $('cf-back');
  ok.disabled = back.disabled = true;
  const editing = state.editingId;
  ok.textContent = editing ? '更新中…' : '儲存中…';
  try {
    const d = editing ? await api('update', { id: editing, record: rec }) : await api('save', { record: rec });
    store.set('luff_cache', JSON.stringify(d));
    applyData(d);
    closeConfirm();
    if (editing) exitEdit();
    resetForm();
    if (editing) showTab('recent');
    toast(editing ? '已更新' : '已儲存');
  } catch (e) {
    toast((editing ? '更新' : '儲存') + '失敗：' + e.message);
  } finally {
    ok.disabled = back.disabled = false;
    ok.textContent = state.editingId ? '確認更新' : '確認儲存';
  }
};
function resetForm() {
  ['name', 'amount', 'note'].forEach(id => $(id).value = '');
  Object.values(state.sel).forEach(s => s.clear());
  Object.keys(TYPES).forEach(renderChips);
  $('suggest').innerHTML = '';
  renderCodes();
  window.scrollTo(0, 0);
}

/* ----- 分頁 ----- */
function showTab(name) {
  if (name !== 'customers' && $('view-customers') && !$('view-customers').classList.contains('hidden')) closeCustomer();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  $('view-form').classList.toggle('hidden', name !== 'form');
  $('view-recent').classList.toggle('hidden', name !== 'recent');
  $('view-customers').classList.toggle('hidden', name !== 'customers');
  $('view-stats').classList.toggle('hidden', name !== 'stats');
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => { t.onclick = () => showTab(t.dataset.tab); });

/* ----- 開啟時 ----- */
(function start() {
  if (!store.get('luff_token')) { showLogin(''); return; }
  $('app').classList.remove('hidden');
  // 先顯示上次的資料，背景再更新，打開比較快
  const cached = store.get('luff_cache');
  if (cached) { try { applyData(JSON.parse(cached)); } catch (e) {} }
  load();
})();
// 從背景切回 App 時自動更新
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkUpdate();
  if (store.get('luff_token')) load();
});

/* ----- 自動檢查新版本 ----- */
function formDirty() {
  return !!($('name').value || $('amount').value || $('note').value || state.editingId ||
    Object.values(state.sel).some(s => s.size));
}
async function checkUpdate() {
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION) return;
    const go = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    if (!formDirty()) return go();          // 沒有填到一半的資料，直接更新
    const bar = $('update-bar');            // 有填到一半，先提示，不打斷
    bar.classList.remove('hidden');
    bar.onclick = go;
  } catch (e) {}
}
checkUpdate();
</script>
</body>
